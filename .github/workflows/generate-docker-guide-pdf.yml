name: Generate Docker guide PDF

on:
  push:
    branches: [main]
    paths:
      - 'public/downloads/docker-practical-guide-node-postgresql-interview-prep.docx'
      - '.github/workflows/generate-docker-guide-pdf.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install PDF tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y libreoffice-writer qpdf poppler-utils

      - name: Convert DOCX to verified PDF
        run: |
          set -euo pipefail
          mkdir -p /tmp/docker-guide-pdf
          libreoffice --headless --convert-to pdf --outdir /tmp/docker-guide-pdf public/downloads/docker-practical-guide-node-postgresql-interview-prep.docx

          SOURCE="/tmp/docker-guide-pdf/docker-practical-guide-node-postgresql-interview-prep.pdf"
          TARGET="public/downloads/docker-practical-guide-node-postgresql-interview-prep-v2.pdf"

          test -s "$SOURCE"
          qpdf --check "$SOURCE"
          pdfinfo "$SOURCE" | tee /tmp/docker-guide-pdf/pdfinfo.txt
          pdftotext "$SOURCE" /tmp/docker-guide-pdf/guide.txt
          test -s /tmp/docker-guide-pdf/guide.txt

          PAGES=$(pdfinfo "$SOURCE" | awk '/^Pages:/ {print $2}')
          if [ -z "$PAGES" ] || [ "$PAGES" -lt 1 ]; then
            echo "PDF page validation failed"
            exit 1
          fi

          cp "$SOURCE" "$TARGET"
          qpdf --check "$TARGET"
          sha256sum "$TARGET"

      - name: Commit verified PDF
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/downloads/docker-practical-guide-node-postgresql-interview-prep-v2.pdf
          if git diff --cached --quiet; then
            echo "Verified PDF is already up to date."
          else
            git commit -m "fix: publish verified Docker practical guide PDF"
            git push
          fi
