name: Generate Docker guide PDF

on:
  push:
    branches: [main]
    paths:
      - 'public/downloads/docker-practical-learning-guide.md'
      - '.github/workflows/generate-docker-guide-pdf.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install PDF tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc qpdf poppler-utils fonts-dejavu-core
          python -m pip install --upgrade pip
          python -m pip install weasyprint

      - name: Build readable PDF from clean Markdown
        run: |
          set -euo pipefail
          SOURCE="public/downloads/docker-practical-learning-guide.md"
          HTML="/tmp/docker-practical-learning-guide.html"
          TARGET="public/downloads/docker-practical-learning-guide-v3.pdf"

          pandoc "$SOURCE" \
            --standalone \
            --metadata title="Docker Practical Learning Guide" \
            -o "$HTML"

          python - <<'PY'
          from weasyprint import HTML, CSS

          css = CSS(string=r'''
          @page {
            size: A4;
            margin: 18mm 17mm 18mm 17mm;
            @bottom-left {
              content: "Barnx Studio - Docker Practical Learning Guide";
              font-size: 8px;
              color: #777;
            }
            @bottom-right {
              content: "Page " counter(page) " of " counter(pages);
              font-size: 8px;
              color: #777;
            }
          }
          body {
            font-family: "DejaVu Sans", sans-serif;
            color: #111827;
            font-size: 10.5pt;
            line-height: 1.55;
          }
          h1 {
            font-size: 25pt;
            line-height: 1.08;
            margin: 0 0 14px;
            color: #111827;
          }
          h2 {
            font-size: 17pt;
            line-height: 1.2;
            margin: 28px 0 10px;
            padding-bottom: 6px;
            border-bottom: 1px solid #dbe3ef;
            color: #0b57d0;
          }
          h3 {
            font-size: 12.5pt;
            margin: 18px 0 7px;
          }
          p { margin: 7px 0 10px; }
          ul, ol { margin: 7px 0 12px 20px; padding: 0; }
          li { margin: 4px 0; }
          pre {
            white-space: pre-wrap;
            overflow-wrap: anywhere;
            background: #f4f6f8;
            border: 1px solid #dfe3e8;
            border-radius: 7px;
            padding: 10px 12px;
            font-family: "DejaVu Sans Mono", monospace;
            font-size: 8.7pt;
            line-height: 1.45;
          }
          code {
            font-family: "DejaVu Sans Mono", monospace;
            font-size: 0.92em;
          }
          p code, li code {
            background: #f1f3f5;
            padding: 1px 4px;
            border-radius: 3px;
          }
          blockquote {
            margin: 14px 0;
            padding: 8px 14px;
            border-left: 3px solid #0b57d0;
            background: #f7faff;
            color: #374151;
          }
          a { color: #0b57d0; text-decoration: none; }
          hr { border: 0; border-top: 1px solid #dfe3e8; margin: 24px 0; }
          strong { color: #111827; }
          ''')

          HTML('/tmp/docker-practical-learning-guide.html').write_pdf(
              'public/downloads/docker-practical-learning-guide-v3.pdf',
              stylesheets=[css]
          )
          PY

          test -s "$TARGET"
          qpdf --check "$TARGET"
          pdfinfo "$TARGET"
          pdftotext "$TARGET" /tmp/docker-guide-text.txt
          test -s /tmp/docker-guide-text.txt

          grep -qi "Docker Practical Learning Guide" /tmp/docker-guide-text.txt
          grep -qi "Docker Student API" /tmp/docker-guide-text.txt
          grep -qi "Interview Practice" /tmp/docker-guide-text.txt
          grep -qi "Skills You Can Honestly List" /tmp/docker-guide-text.txt

          echo "PDF content validation passed."
          sha256sum "$TARGET"

      - name: Commit readable PDF
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/downloads/docker-practical-learning-guide-v3.pdf
          if git diff --cached --quiet; then
            echo "Readable PDF is already up to date."
          else
            git commit -m "fix: publish readable Docker learning guide PDF"
            git push
          fi
