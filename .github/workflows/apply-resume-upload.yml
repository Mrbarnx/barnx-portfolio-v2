name: Apply uploaded resume

on:
  push:
    branches: [fix/replace-resume-uploaded]
    paths:
      - '.github/workflows/apply-resume-upload.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rebuild and verify resume PDF
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y qpdf poppler-utils
          python -m pip install --quiet pypdf

          cat .tmp/resume-upload/part{1,2,3,4,5,6}.txt > /tmp/resume.b64
          echo "base64-bytes=$(wc -c < /tmp/resume.b64)"
          base64 -d /tmp/resume.b64 > public/Barnabas-Mikel-Resume.pdf
          echo "pdf-bytes=$(wc -c < public/Barnabas-Mikel-Resume.pdf)"
          sha256sum public/Barnabas-Mikel-Resume.pdf

          qpdf --check public/Barnabas-Mikel-Resume.pdf
          pdfinfo public/Barnabas-Mikel-Resume.pdf | tee /tmp/resume-info.txt
          grep -q '^Pages:[[:space:]]*1$' /tmp/resume-info.txt
          pdftotext public/Barnabas-Mikel-Resume.pdf /tmp/resume.txt
          grep -q 'BARNABAS MIKEL' /tmp/resume.txt
          grep -q 'VIN Startup Project' /tmp/resume.txt
          grep -q 'BANX Automation Studio' /tmp/resume.txt
          grep -q 'Bachelor of Science' /tmp/resume.txt

          python - <<'PY'
          from pypdf import PdfReader
          path = 'public/Barnabas-Mikel-Resume.pdf'
          reader = PdfReader(path)
          assert len(reader.pages) == 1
          text = reader.pages[0].extract_text() or ''
          for phrase in ['BARNABAS MIKEL', 'VIN Startup Project', 'BANX Automation Studio', 'Bachelor of Science (B.Sc.), Human Anatomy']:
              assert phrase in text, phrase
          uris = []
          for ref in reader.pages[0].get('/Annots', []):
              obj = ref.get_object()
              action = obj.get('/A')
              if action and action.get('/URI'):
                  uris.append(str(action.get('/URI')))
          expected = {
              'mailto:mrbarnx@gmail.com',
              'https://github.com/Mrbarnx',
              'https://barnx-portfolio-v2.vercel.app/',
              'https://www.linkedin.com/in/mrbarns',
              'https://github.com/Mrbarnx/SUBLY',
              'https://github.com/Mrbarnx/banxweb',
              'https://github.com/Mrbarnx/Omni-Channel-AI-Chatbot-Node.js-',
          }
          assert set(uris) == expected, uris
          print('Verified links:', len(uris))
          PY

      - name: Commit only the resume
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -r .tmp/resume-upload
          git rm .github/workflows/apply-resume-upload.yml
          git add public/Barnabas-Mikel-Resume.pdf
          git commit -m "chore: replace portfolio resume with uploaded ATS version"
          git push
